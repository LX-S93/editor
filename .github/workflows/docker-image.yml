name: Docker image

# Builds the self-hosted image (see Dockerfile) and publishes it to the GitHub
# Container Registry of this repository: ghcr.io/<owner>/<repo>:latest
# Compiling the monorepo needs several GB of RAM, so it happens here and not on
# the machine that runs the container.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'unraid/**'
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
